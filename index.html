<!doctype html>
<html lang="fr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spa</title>
<style>
  body{font:16px system-ui;max-width:760px;margin:1rem auto;padding:0 1rem;background:#111;color:#eee}
  .card{background:#1c1c1c;border-radius:8px;padding:1rem;margin:1rem 0} h2{margin:.2rem 0}
  .off{color:#f66;font-weight:bold} .on{color:#6c6}
  table{border-collapse:collapse;width:100%} td{padding:.2rem .5rem;border-top:1px solid #333}
  input,button{font:inherit;padding:.4rem;margin:.2rem 0;display:block} #err{color:#f66}
</style>
<h1>Spa</h1>

<form id=login class=card hidden>
  <h2>Connexion Control My Spa</h2>
  <input id=email type=email placeholder="Email" autocomplete=username required>
  <input id=pwd type=password placeholder="Mot de passe" autocomplete=current-password required>
  <button>Se connecter</button>
  <small>Le mot de passe n'est jamais stocké, seulement les jetons de session.</small>
</form>
<div id=err></div>

<div id=app hidden>
  <div id=spas></div>
  <div class=card><h2>Durées (7 jours)</h2><div id=stats></div></div>
  <div class=card><h2>Journal</h2><table id=events></table></div>
  <button id=notif>Activer les notifications d'alerte</button>
  <button id=logout>Se déconnecter</button>
  <small>Les relevés ne sont faits que page ouverte. Garder cet onglet ouvert pour surveiller le spa.</small>
</div>

<script src="stats.js"></script>
<script>
const API = 'https://iot.controlmyspa.com/web', POLL_MS = 60000, KEEP_MS = 14 * 864e5;
const $ = id => document.getElementById(id);
const store = (k, v) => v === undefined ? JSON.parse(localStorage.getItem('spa.' + k) || 'null') : localStorage.setItem('spa.' + k, JSON.stringify(v));

// ---- API ----
// shortcut: corps/réponse de /auth/login et /auth/refresh supposés ({email,password} / {refreshToken} -> {data:{accessToken,refreshToken}}); à confirmer au premier essai.
async function post(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})), d = j.data ?? j;
  const access = d.accessToken ?? d.access_token ?? d.token;
  if (!r.ok || !access) throw new Error(`${path} (${r.status}) ${j.message ?? 'réponse inattendue, clés: ' + Object.keys(d)}`);
  store('tokens', { access, refresh: d.refreshToken ?? d.refresh_token ?? store('tokens')?.refresh });
}
async function get(path, retry = true) {
  const t = store('tokens'); if (!t) throw new Error('non connecté');
  const r = await fetch(API + path, { headers: { authorization: 'Bearer ' + t.access } });
  if (r.status === 401 && retry) { await post('/auth/refresh', { refreshToken: t.refresh }); return get(path, false); }
  if (!r.ok) throw new Error(`${path} -> ${r.status}`);
  return (await r.json()).data;
}

// ---- Relevés ----
const log = (spa, msg) => {
  store('events', [{ ts: Date.now(), spa, msg }, ...(store('events') || [])].slice(0, 200));
  if (window.Notification && Notification.permission === 'granted') new Notification('Spa', { body: spa + ' : ' + msg });
};
async function poll() {
  try {
    const { spas } = await get('/spas?page=0&pageSize=100');
    const now = Date.now(), all = store('samples') || {}, names = store('names') || {}, live = store('live') || {};
    for (const s of spas) {
      names[s._id] = `${s.modelType || 'Spa'} ${s.serialNumber}`;
      const state = await get(`/spas/${s._id}/current-state`);
      const c8z = await get(`/spas/${s._id}/current-c8z`).catch(() => null);
      const x = SpaStats.compact(state, c8z, now), prev = (all[s._id] || []).at(-1);
      if (prev && prev.online !== x.online) log(names[s._id], x.online ? 'de nouveau en ligne' : 'HORS LIGNE');
      if (prev && prev.err !== x.err) log(names[s._id], `code erreur ${prev.err} -> ${x.err}`);
      all[s._id] = [...(all[s._id] || []), x].filter(v => v.ts > now - KEEP_MS);
      live[s._id] = { ts: now, state, c8z };
    }
    store('names', names); store('live', live);
    try { store('samples', all); } catch (e) { log('app', 'localStorage plein, historique non enregistré'); }
    $('err').textContent = '';
  } catch (e) {
    $('err').textContent = e.message;
    if (!store('tokens') || /refresh|non connecté/.test(e.message)) show(false);
  }
  render();
}

// ---- Affichage ----
const h = s => Math.floor(s / 3600) + ' h ' + Math.round(s % 3600 / 60) + ' min';
const T = ts => new Date(ts).toLocaleString('fr-FR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
function render() {
  const names = store('names') || {}, live = store('live') || {}, all = store('samples') || {};
  $('spas').innerHTML = Object.entries(live).map(([id, { ts, state: x, c8z }]) => `<div class=card><h2>${esc(names[id])}</h2>
    <div class=${x.online ? 'on' : 'off'}>${x.online ? 'En ligne' : 'HORS LIGNE'}</div>
    <p>Eau ${esc(x.currentTemp)}° · consigne ${esc(x.desiredTemp)}° · ${esc(x.heaterMode)} · chauffe ${esc(c8z?.c8zHeaterState)}</p>
    <p>${(x.components || []).filter(c => c.value).map(c => esc(c.componentType + ': ' + c.value)).join(' · ')}</p>
    <small>relevé ${T(ts)} · plage ${esc(x.tempRange)}, éco ${esc(x.ecoMode)}, filtration 2 ${esc(x.secondaryFiltrationMode)}</small></div>`).join('');
  const since = Date.now() - 7 * 864e5;
  $('stats').innerHTML = '<table>' + Object.entries(all).map(([id, a]) => {
    const r = SpaStats.runtimes(a.filter(v => v.ts > since), POLL_MS * 3);
    return `<tr><td>${esc(names[id])}</td><td>pompes ${h(r.runningS)}</td><td>avec chauffe ${h(r.heatingS)}</td><td>sans chauffe ${h(r.runningNoHeatS)}</td><td>hors ligne ${h(r.offlineS)}</td></tr>`;
  }).join('') + '</table>';
  $('events').innerHTML = (store('events') || []).map(e => `<tr><td>${T(e.ts)}</td><td>${esc(e.spa)}</td><td>${esc(e.msg)}</td></tr>`).join('') || '<tr><td>Aucun événement</td></tr>';
  document.title = (Object.values(live).some(l => !l.state.online) ? '⚠ HORS LIGNE – ' : '') + 'Spa';
}

let timer;
function show(loggedIn) {
  $('login').hidden = loggedIn; $('app').hidden = !loggedIn;
  clearInterval(timer);
  if (loggedIn) { render(); poll(); timer = setInterval(poll, POLL_MS); }
}
$('login').onsubmit = async e => {
  e.preventDefault();
  try { await post('/auth/login', { email: $('email').value, password: $('pwd').value }); $('pwd').value = ''; show(true); }
  catch (er) { $('err').textContent = er.message; }
};
$('logout').onclick = () => { localStorage.removeItem('spa.tokens'); show(false); };
$('notif').onclick = () => window.Notification && Notification.requestPermission();
show(!!store('tokens'));
</script>
